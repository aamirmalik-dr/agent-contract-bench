[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-contract-bench"
version = "0.1.0"
description = "Benchmark harness for tool-using LLM agents: capability contracts, deterministic fault injection, prompt-injection scenarios and attempted-versus-executed violation accounting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aamir Malik" }]
keywords = ["llm-agents", "agent-evaluation", "benchmark", "prompt-injection", "ai-safety", "tool-use"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.5"]

[project.scripts]
agent-contract-bench = "agent_contract_bench.__main__:main"

[project.urls]
Repository = "https://github.com/aamirmalik-dr/agent-contract-bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_suites.py" = ["E501"]  # suite text: long prose strings are data

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
