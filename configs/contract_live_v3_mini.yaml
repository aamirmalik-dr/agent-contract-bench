# v2 round, run A: fresh held-out family heldout3 (written after the v2
# pre-registration) with the pre-registered prompt fix (contract-prompts-v3).
# Same model, caps and prices as the earlier pilots. Frozen 2026-11-09.
mode: live
model: openai/gpt-4.1-mini        # via OpenRouter
families: [heldout3]
arms: [baseline, single_call, guarded, naive]
runs: 2
episode:
  max_steps: 20
  harness_extra_calls: 4
  max_tokens: 60000
  max_wall_seconds: 300
  recent_k: 4
  max_completion_tokens: 900
run_caps:
  max_total_tokens: 3000000
  max_usd: 0.40
  usd_per_mtok_input: 0.40
  usd_per_mtok_output: 1.60
output_dir: reports/live_v3
checkpoint_dir: runs/v3_mini
